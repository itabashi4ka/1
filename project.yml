# XcodeGen の設定。Mac で `xcodegen generate` を実行すると InstallmentCalculator.xcodeproj ができる。
name: InstallmentCalculator
options:
  bundleIdPrefix: local.clinic
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ja
packages:
  InstallmentKit:
    path: InstallmentKit
targets:
  InstallmentCalculator:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
    dependencies:
      - package: InstallmentKit
        product: InstallmentKit
    scheme:
      testTargets:
        - package: InstallmentKit/InstallmentKitTests
    settings:
      base:
        PRODUCT_NAME: InstallmentCalculator
        PRODUCT_BUNDLE_IDENTIFIER: local.clinic.InstallmentCalculator
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 分割払い計算
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # iPad のみ（iPhone は対象外）
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SUPPORTS_MACCATALYST: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/InstallmentCalculator-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
